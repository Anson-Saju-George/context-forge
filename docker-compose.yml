services:
  context-forge:
    build:
      context: .
    ports:
      # HOST_PORT controls only the local browser URL; container internal port stays 8000.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      # Lets the container reach Ollama running on the host (Linux needs this explicitly;
      # Docker Desktop on Windows/Mac already resolves host.docker.internal).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      # Must match routing.api_prefix in config.json / API_PREFIX in .env.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/context-forge/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
